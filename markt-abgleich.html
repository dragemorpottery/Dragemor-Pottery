<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marktabgleich · Dragemor Pottery</title><style>body{background:#f6f5ef;color:#253d33;font:16px/1.6 system-ui;margin:30px auto;padding:24px;max-width:480px}h1{font:34px Georgia}input,button{box-sizing:border-box;font:inherit;padding:14px;border-radius:10px;border:1px solid #c9d0c0;width:100%;margin:9px 0}button{background:#2e493f;color:white;cursor:pointer}.box{background:#fffefa;border:1px solid #dedfd4;padding:20px;border-radius:14px}small{color:#6c786d}a{color:inherit}</style><h1>Dein Shop ist verbunden.</h1><div class="box"><p id="status" role="status">Anmeldung wird geprüft …</p><form id="login" hidden><label for="password">Passwort deiner Shop-Verwaltung</label><input id="password" type="password" autocomplete="current-password" required><button>Anmelden & verbinden</button><small>Dein Passwort bleibt beim Shop. Die Marktübersicht erhält keine Zugangsdaten.</small></form><button id="retry">Verbindung prüfen</button></div><p><small>Lass dieses Fenster für den Abgleich geöffnet. Kehre anschließend zum Marktbegleiter zurück. Nur mit Internet können Shop-Verkäufe bestätigt werden.</small></p><script>
'use strict';const SITE='https://dragemor-marktbegleiter.ample-moth-4739.chatgpt.site';const status=document.querySelector('#status'),login=document.querySelector('#login');let ready=false;
const tell=message=>{if(window.opener)window.opener.postMessage({channel:'dragemor-market-v1',...message},SITE)};
async function check(){try{const r=await fetch('/api/admin-check',{cache:'no-store'});ready=r.ok;login.hidden=ready;status.textContent=ready?'Verbunden. Du kannst zum Marktbegleiter zurückkehren. Dieses Fenster bitte geöffnet lassen.':'Bitte melde dich einmal mit deinem Verwaltungspasswort an.';if(ready)tell({type:'ready'})}catch{status.textContent='Keine Verbindung. Bitte Internet prüfen.'}}
login.onsubmit=async e=>{e.preventDefault();try{const password=document.querySelector('#password');const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});password.value='';if(!r.ok){status.textContent='Anmeldung fehlgeschlagen. Bitte Passwort prüfen.';return}await check()}catch{status.textContent='Anmeldung derzeit nicht möglich.'}};
document.querySelector('#retry').onclick=check;
window.addEventListener('message',async e=>{if(e.origin!==SITE||e.source!==window.opener||e.data?.channel!=='dragemor-market-v1')return;const {type,requestId,body}=e.data;if(type==='hello'){await check();return}if(type!=='request'||!ready||typeof requestId!=='string'||!/^\d+-\d+$/.test(requestId))return;try{if(body&&!['sale','update-sale','cancel-sale'].includes(body.action))throw Error('Unzulässige Aktion');const r=await fetch('/api/admin-products?resource=market',{cache:'no-store',method:body?'POST':'GET',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const result=await r.json();if(r.status===401){ready=false;login.hidden=false;status.textContent='Anmeldung abgelaufen. Bitte erneut anmelden.'}tell({type:'response',requestId,ok:r.ok,result})}catch{tell({type:'response',requestId,ok:false,result:{error:'Shop nicht erreichbar. Es wurde keine Bestätigung empfangen. Bitte erneut abgleichen.'}})}});check();
</script></html>
