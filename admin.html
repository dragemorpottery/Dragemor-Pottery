<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragemor Pottery – Verwaltung</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #a8ad96;
      color: #292a26;
      font-family: Georgia, "Times New Roman", serif;
    }

    .login {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      background: #f4f0e7;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: normal;
    }

    .subtitle {
      margin: 0 0 28px;
      opacity: .7;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #b8b8ad;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #292a26;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>Dragemor Pottery</h1>
    <p class="subtitle">Geschützte Verwaltung ♡</p>

    <form id="loginForm">
      <input
        id="password"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Verwaltung öffnen
      </button>
    </form>

    <div id="message"></div>
  </div>
  
<div id="verwaltung" style="display:none; width:100%; max-width:700px;">
    <h1>Produktverwaltung</h1>
    <p class="subtitle">Dragemor Pottery ♡</p>

<div id="neuesProduktBereich" style="margin: 24px 0;">
    <button type="button" id="neuesProduktButton">
        + Neues Produkt anlegen
    </button>
  <div id="neuesProduktFormular" style="display:none; margin-top:20px;">
    <h2>Neues Produkt</h2>

    <input type="text" id="produktName" placeholder="Name / Serie">

    <select id="produktKategorie">
        <option value="">Kategorie auswählen</option>
        <option value="Momente des Innehaltens">Momente des Innehaltens</option>
        <option value="Gemeinsame Zeit">Gemeinsame Zeit</option>
        <option value="Raum für Natur">Raum für Natur</option>
        <option value="Kleine Schätze">Kleine Schätze</option>
        <option value="Weihnachtswerkstatt">Weihnachtswerkstatt</option>
        <option value="Leder">Leder</option>
    </select>

    <input type="number" id="produktPreis" placeholder="Preis in €" step="0.01">

    <input type="text" id="produktMass" placeholder="Volumen / Durchmesser / Größe">

    <textarea id="produktBeschreibung" placeholder="Beschreibung"></textarea>

<label for="produktBilder">Produktbilder auswählen:</label>
<input type="file" id="produktBilder" accept="image/*" multiple>
<button type="button" id="produktSpeichernButton" style="margin-top:16px;">
    Produkt speichern ♡
</button>

<div id="produktSpeichernStatus" style="margin-top:10px;"></div> 
</div> 
</div> 
  
    <div id="produktListe">
      Produkte werden geladen …
    </div>
  </div> 
  
  <script>
    
    document.getElementById("neuesProduktButton").addEventListener("click", () => {
    const formular = document.getElementById("neuesProduktFormular");

    if (formular.style.display === "none") {
        formular.style.display = "block";
    } else {
        formular.style.display = "none";
    }
}); 

document.getElementById("produktSpeichernButton").addEventListener("click", async () => {
  const status = document.getElementById("produktSpeichernStatus");

  const name = document.getElementById("produktName").value.trim();
  const category = document.getElementById("produktKategorie").value;
  const priceEuro = document.getElementById("produktPreis").value;
  const measure = document.getElementById("produktMass").value.trim();
  const description = document.getElementById("produktBeschreibung").value.trim();
  const imageFiles = Array.from(document.getElementById("produktBilder").files);

  if (!name || !category || !priceEuro) {
    status.textContent = "Bitte Name, Kategorie und Preis ausfüllen.";
    return;
  }

  status.textContent = "Produkt wird gespeichert …";
  const productId = `produkt-${Date.now()}`; 
  const price = Math.round(parseFloat(priceEuro.replace(",", ".")) * 100);

 const images = await Promise.all(
  imageFiles.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = event => {
      const img = new Image();

      img.onload = () => {
        const maxSize = 1400;
        let width = img.width;
        let height = img.height;

        if (width > height && width > maxSize) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };

      img.onerror = reject;
      img.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  }))
); 


try {
    const response = await fetch("/api/admin-products", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            action: "create-product",
            product_id: productId,
            name,
            category,
            price,
            measure,
            description,
            images
        })
    });

    const data = await response.json();

    if (!response.ok) {
        status.textContent = data.error || "Produkt konnte nicht gespeichert werden.";
        return;
    }

    status.textContent = "Produkt wurde gespeichert ♡";
    await ladeProdukte();

} catch (error) {
    console.error(error);
    status.textContent = "Produkt konnte nicht gespeichert werden.";
} 
}); 
    
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

const loginBox = document.querySelector(".login");
const verwaltung = document.getElementById("verwaltung");
const produktListe = document.getElementById("produktListe");

async function ladeProdukte() {
  produktListe.innerHTML = "Produkte werden geladen …";

  try {
    const response = await fetch("/api/admin-products");

    if (!response.ok) {
      produktListe.innerHTML = "Produkte konnten nicht geladen werden.";
      return;
    }

    const data = await response.json();

    produktListe.innerHTML = "";

const keramikProdukte = [
  "keramik-1",
  "keramik-4",
  "keramik-7",
  "keramik-9",
  "keramik-12",
  "keramik-14",
  "keramik-24",
  "keramik-26",
  "keramik-30",
  "keramik-33",
  "keramik-37",
  "keramik-40",
  "keramik-49",
  "keramik-53",
  "keramik-56",
  "keramik-58"
];
    const lederProdukte = [
"leder-1",
  "leder-2",
  "leder-3",
  "leder-4",
  "leder-5",
  "leder-6",
  "leder-7",
  "leder-8",
  "leder-9",
  "leder-10",
  "leder-11",
  "leder-12" 
    ];
    
const sichtbareProdukte = data.products.filter(product =>
    keramikProdukte.includes(product.product_id) ||
    lederProdukte.includes(product.product_id) ||
    product.product_id.startsWith("produkt-")
); 
    
    sichtbareProdukte.forEach(product => {
      const card = document.createElement("div");

      card.style.background = "#f4f0e7";
      card.style.padding = "18px";
      card.style.marginBottom = "12px";
      card.style.borderRadius = "14px";

      const istVerfuegbar = product.status === "available";

const statusText = istVerfuegbar
  ? "Verfügbar ♡"
  : "Mitgenommen ♡";

const buttonText = istVerfuegbar
  ? "Mitgenommen ♡"
  : "Wieder verfügbar";

card.innerHTML = `
 <strong>${product.name || product.product_id}</strong> 
  <br>
  <span>${statusText}</span>

  <button class="statusButton"
    type="button"
    style="margin-top:14px;"
    data-product-id="${product.product_id}"
    data-new-status="${istVerfuegbar ? "sold" : "available"}"
  >
    ${buttonText}
</button>
${product.images?.[0] ? `<img src="${product.images[0]}" alt="${product.name || 'Produkt'}" style="width:100%;max-width:180px;border-radius:10px;margin-top:12px;">` : ""} 

`;

const button = card.querySelector(".statusButton");

button.addEventListener("click", async () => {
  const productId = button.dataset.productId;
  const newStatus = button.dataset.newStatus;

  const frage = newStatus === "sold"
    ? `${productId} wirklich als mitgenommen markieren?`
    : `${productId} wieder verfügbar machen?`;

  if (!confirm(frage)) {
    return;
  }

  button.disabled = true;
  button.textContent = "Wird gespeichert …";

  try {
    const response = await fetch("/api/admin-products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        product_id: productId,
        status: newStatus
      })
    });

    if (!response.ok) {
      alert("Der Status konnte nicht gespeichert werden.");
      button.disabled = false;
      return;
    }

    await ladeProdukte();

  } catch (error) {
    alert("Der Status konnte nicht gespeichert werden.");
    button.disabled = false;
  }
});

produktListe.appendChild(card); 

    });

  } catch (error) {
    produktListe.innerHTML =
      "Produkte konnten nicht geladen werden.";
  }
}

function zeigeVerwaltung() {
  loginBox.style.display = "none";
  verwaltung.style.display = "block";
  ladeProdukte();
} 
    
  async function checkLogin() {
    try {
      const response = await fetch("/api/admin-check");

      if (response.ok) {
        const data = await response.json();

        if (data.authenticated) {
          message.textContent = "Geschützte Sitzung aktiv ♡";
          zeigeVerwaltung();
          return true;
        }
      }
    } catch (error) {
      console.error(error);
    }

    return false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;

    message.textContent = "Anmeldung wird geprüft …";

    try {
      const response = await fetch("/api/admin-login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });

      const data = await response.json();

      if (response.ok && data.ok) {
        document.getElementById("password").value = "";

        const authenticated = await checkLogin();

        if (authenticated) {
          message.textContent = "Geschützte Anmeldung erfolgreich ♡";
        } else {
          message.textContent =
            "Anmeldung war erfolgreich, Sitzung konnte aber nicht bestätigt werden.";
        }
      } else {
        message.textContent =
          data.message || "Passwort ist nicht korrekt.";
      }
    } catch (error) {
      message.textContent =
        "Die Anmeldung konnte nicht geprüft werden.";
    }
  });

  checkLogin();
</script> 

</body>
</html>
